<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Coffee Tracker · Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f0efec;
        color: #313831;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --primary-text-color: #343b34;
        --secondary-text-color: #7a8078;
        --primary-color: #926d4f;
        --text-primary-color: #fff;
        --card-background-color: #fafaf7;
        --ha-card-background: #fafaf7;
        --ha-card-border-radius: 24px;
        --divider-color: #3331;
        transition: background 0.2s;
      }
      .dark {
        background: #15161e;
        color: #d9dced;
        --primary-text-color: #d9dced;
        --secondary-text-color: #a4a8be;
        --primary-color: #c4a880;
        --text-primary-color: #30271c;
        --card-background-color: #242632;
        --ha-card-background: #242632;
        --divider-color: #fff1;
      }
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        max-width: 1050px;
        margin: 0 auto;
        padding: 30px 24px 24px;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      .tag {
        font-size: 10px;
        padding: 5px 8px;
        border: 1px solid var(--divider-color);
        border-radius: 6px;
        font-weight: 500;
        opacity: 0.6;
      }
      .tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      button,
      select {
        font: inherit;
        font-size: 11px;
        min-height: 34px;
        padding: 7px 10px;
        border: 1px solid var(--divider-color);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      select option {
        color: #222;
        background: #fff;
      }
      .stage {
        max-width: 430px;
        margin: 8px auto 40px;
        padding: 0 15px;
      }
      .caption {
        text-align: center;
        color: var(--secondary-text-color);
        font-size: 10px;
        line-height: 1.6;
        margin: 18px 0;
      }
      ha-card {
        display: block;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--primary-color);
        outline-offset: 2px;
      }
      @media (max-width: 480px) {
        .masthead {
          padding: 18px 18px 12px;
        }
        .stage {
          margin-top: 5px;
        }
        .tools {
          gap: 5px;
        }
      }
    </style>
  </head>
  <body class="dark">
    <header class="masthead">
      <div class="wordmark">
        Coffee Tracker <span class="tag">INTERACTIVE PREVIEW</span>
      </div>
      <div class="tools">
        <button id="theme">Light theme</button
        ><select id="scenario" aria-label="Preview scenario">
          <option value="normal">Shared pool</option>
          <option value="empty">New pool</option>
          <option value="low">Low balance</option>
          <option value="negative">Negative balance</option>
          <option value="offline">Disconnected</option>
          <option value="failure">Service failure</option></select
        ><button id="watch">Watch: 1 coffee</button
        ><button id="narrow">320px</button>
      </div>
    </header>
    <main class="stage">
      <coffee-tracker-card></coffee-tracker-card>
      <p class="caption">
        A little ritual. A shared balance.<br />All data is synthetic. No real
        accounts or payments.
      </p>
    </main>
    <script type="module">
      import "../custom_components/coffee_tracker/www/coffee-tracker-card.js";
      import { createMockPool, mockConfig } from "./fixtures.mjs";
      // Preview only: Home Assistant supplies ha-icon in the installed card.
      // These Material Design Icons paths keep the standalone demo faithful.
      const mdiPaths = {
        "mdi:cog":
          "M19.43 12.98C19.47 12.66 19.5 12.34 19.5 12S19.47 11.34 19.42 11.02L21.53 9.37C21.72 9.22 21.77 8.95 21.65 8.73L19.65 5.27C19.53 5.05 19.27 4.97 19.05 5.05L16.56 6.05C16.04 5.65 15.49 5.32 14.88 5.07L14.5 2.42C14.46 2.18 14.25 2 14 2H10C9.75 2 9.54 2.18 9.5 2.42L9.12 5.07C8.51 5.32 7.95 5.66 7.44 6.05L4.95 5.05C4.72 4.96 4.47 5.05 4.35 5.27L2.35 8.73C2.22 8.95 2.28 9.22 2.47 9.37L4.58 11.02C4.53 11.34 4.5 11.67 4.5 12S4.53 12.66 4.58 12.98L2.47 14.63C2.28 14.78 2.23 15.05 2.35 15.27L4.35 18.73C4.47 18.95 4.73 19.03 4.95 18.95L7.44 17.95C7.96 18.35 8.51 18.68 9.12 18.93L9.5 21.58C9.54 21.82 9.75 22 10 22H14C14.25 22 14.46 21.82 14.5 21.58L14.88 18.93C15.49 18.68 16.05 18.35 16.56 17.95L19.05 18.95C19.28 19.04 19.53 18.95 19.65 18.73L21.65 15.27C21.77 15.05 21.72 14.78 21.53 14.63L19.43 12.98M12 15.5A3.5 3.5 0 1 1 12 8.5A3.5 3.5 0 0 1 12 15.5Z",
        "mdi:chevron-down":
          "M7.41 8.59L12 13.17L16.59 8.59L18 10L12 16L6 10L7.41 8.59Z",
        "mdi:chevron-up":
          "M7.41 15.41L12 10.83L16.59 15.41L18 14L12 8L6 14L7.41 15.41Z",
        "mdi:delete-outline":
          "M6 19A2 2 0 0 0 8 21H16A2 2 0 0 0 18 19V7H6V19M8 9H16V19H8V9M15.5 4L14.5 3H9.5L8.5 4H5V6H19V4H15.5Z",
      };
      customElements.define(
        "ha-icon",
        class extends HTMLElement {
          static observedAttributes = ["icon"];
          connectedCallback() {
            this.render();
          }
          attributeChangedCallback() {
            this.render();
          }
          render() {
            if (!this.shadowRoot) this.attachShadow({ mode: "open" });
            this.shadowRoot.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:block;width:100%;height:100%;fill:currentColor"><path d="${mdiPaths[this.getAttribute("icon")] || ""}"></path></svg>`;
          }
        },
      );
      const card = document.querySelector("coffee-tracker-card");
      card.setConfig(mockConfig);
      let pool, off;
      function setup(value = "normal") {
        off?.();
        pool = createMockPool({
          empty: value === "empty",
          balance: value === "low" ? 75 : value === "negative" ? -225 : 2450,
          failOnce: value === "failure",
        });
        const publish = (h) => {
          card.hass = value === "offline" ? { ...h, connected: false } : h;
        };
        publish(pool.hass());
        off = pool.subscribe(publish);
        window.demoPool = pool;
      }
      setup();
      document.querySelector("#scenario").onchange = (e) =>
        setup(e.target.value);
      document.querySelector("#theme").onclick = (e) => {
        document.body.classList.toggle("dark");
        e.target.textContent = document.body.classList.contains("dark")
          ? "Light theme"
          : "Dark theme";
      };
      document.querySelector("#watch").onclick = () => pool.externalCoffee();
      document.querySelector("#narrow").onclick = (e) => {
        const s = document.querySelector(".stage");
        const narrow = s.style.maxWidth === "320px";
        s.style.maxWidth = narrow ? "430px" : "320px";
        e.target.textContent = narrow ? "320px" : "430px";
      };
    </script>
  </body>
</html>
