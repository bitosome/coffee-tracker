<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Coffee Tracker · Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f0efec;
        color: #313831;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --primary-text-color: #343b34;
        --secondary-text-color: #7a8078;
        --primary-color: #926d4f;
        --text-primary-color: #fff;
        --card-background-color: #fafaf7;
        --ha-card-background: #fafaf7;
        --ha-card-border-radius: 24px;
        --divider-color: #3331;
        transition: background 0.2s;
      }
      .dark {
        background: #15161e;
        color: #d9dced;
        --primary-text-color: #d9dced;
        --secondary-text-color: #a4a8be;
        --primary-color: #c4a880;
        --text-primary-color: #30271c;
        --card-background-color: #242632;
        --ha-card-background: #242632;
        --divider-color: #fff1;
      }
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        max-width: 1050px;
        margin: 0 auto;
        padding: 30px 24px 24px;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      .tag {
        font-size: 10px;
        padding: 5px 8px;
        border: 1px solid var(--divider-color);
        border-radius: 6px;
        font-weight: 500;
        opacity: 0.6;
      }
      .tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      button,
      select {
        font: inherit;
        font-size: 11px;
        min-height: 34px;
        padding: 7px 10px;
        border: 1px solid var(--divider-color);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      select option {
        color: #222;
        background: #fff;
      }
      .stage {
        max-width: 430px;
        margin: 8px auto 40px;
        padding: 0 15px;
      }
      .caption {
        text-align: center;
        color: var(--secondary-text-color);
        font-size: 10px;
        line-height: 1.6;
        margin: 18px 0;
      }
      ha-card {
        display: block;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--primary-color);
        outline-offset: 2px;
      }
      @media (max-width: 480px) {
        .masthead {
          padding: 18px 18px 12px;
        }
        .stage {
          margin-top: 5px;
        }
        .tools {
          gap: 5px;
        }
      }
    </style>
  </head>
  <body class="dark">
    <header class="masthead">
      <div class="wordmark">
        Coffee Tracker <span class="tag">INTERACTIVE PREVIEW</span>
      </div>
      <div class="tools">
        <button id="theme">Light theme</button
        ><select id="scenario" aria-label="Preview scenario">
          <option value="normal">Shared pool</option>
          <option value="empty">New pool</option>
          <option value="low">Low balance</option>
          <option value="negative">Negative balance</option>
          <option value="offline">Disconnected</option>
          <option value="failure">Service failure</option></select
        ><button id="watch">Watch: 1 coffee</button
        ><button id="narrow">320px</button>
      </div>
    </header>
    <main class="stage">
      <coffee-tracker-card></coffee-tracker-card>
      <p class="caption">
        A little ritual. A shared balance.<br />All data is synthetic. No real
        accounts or payments.
      </p>
    </main>
    <script type="module">
      import "../custom_components/coffee_tracker/www/coffee-tracker-card.js";
      import { createMockPool, mockConfig } from "./fixtures.mjs";
      const card = document.querySelector("coffee-tracker-card");
      card.setConfig(mockConfig);
      let pool, off;
      function setup(value = "normal") {
        off?.();
        pool = createMockPool({
          empty: value === "empty",
          balance: value === "low" ? 75 : value === "negative" ? -225 : 2450,
          failOnce: value === "failure",
        });
        const publish = (h) => {
          card.hass = value === "offline" ? { ...h, connected: false } : h;
        };
        publish(pool.hass());
        off = pool.subscribe(publish);
        window.demoPool = pool;
      }
      setup();
      document.querySelector("#scenario").onchange = (e) =>
        setup(e.target.value);
      document.querySelector("#theme").onclick = (e) => {
        document.body.classList.toggle("dark");
        e.target.textContent = document.body.classList.contains("dark")
          ? "Light theme"
          : "Dark theme";
      };
      document.querySelector("#watch").onclick = () => pool.externalCoffee();
      document.querySelector("#narrow").onclick = (e) => {
        const s = document.querySelector(".stage");
        const narrow = s.style.maxWidth === "320px";
        s.style.maxWidth = narrow ? "430px" : "320px";
        e.target.textContent = narrow ? "320px" : "430px";
      };
    </script>
  </body>
</html>
