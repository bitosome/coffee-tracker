<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Coffee Tracker · Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f0efec;
        color: #313831;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --primary-text-color: #343b34;
        --secondary-text-color: #7a8078;
        --primary-color: #926d4f;
        --text-primary-color: #fff;
        --card-background-color: #fafaf7;
        --ha-card-background: #fafaf7;
        --ha-card-border-radius: 24px;
        --divider-color: #3331;
        transition: background 0.2s;
      }
      .dark {
        background: #15161e;
        color: #d9dced;
        --primary-text-color: #d9dced;
        --secondary-text-color: #a4a8be;
        --primary-color: #c4a880;
        --text-primary-color: #30271c;
        --card-background-color: #242632;
        --ha-card-background: #242632;
        --divider-color: #fff1;
      }
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        max-width: 1050px;
        margin: 0 auto;
        padding: 30px 24px 24px;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      .tag {
        font-size: 10px;
        padding: 5px 8px;
        border: 1px solid var(--divider-color);
        border-radius: 6px;
        font-weight: 500;
        opacity: 0.6;
      }
      .tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      button,
      select {
        font: inherit;
        font-size: 11px;
        min-height: 34px;
        padding: 7px 10px;
        border: 1px solid var(--divider-color);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      select option {
        color: #222;
        background: #fff;
      }
      .stage {
        max-width: 430px;
        margin: 8px auto 40px;
        padding: 0 15px;
      }
      .caption {
        text-align: center;
        color: var(--secondary-text-color);
        font-size: 10px;
        line-height: 1.6;
        margin: 18px 0;
      }
      ha-card {
        display: block;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--primary-color);
        outline-offset: 2px;
      }
      @media (max-width: 480px) {
        .masthead {
          padding: 18px 18px 12px;
        }
        .stage {
          margin-top: 5px;
        }
        .tools {
          gap: 5px;
        }
      }
    </style>
  </head>
  <body class="dark">
    <header class="masthead">
      <div class="wordmark">
        Coffee Tracker <span class="tag">INTERACTIVE PREVIEW</span>
      </div>
      <div class="tools">
        <button id="theme">Light theme</button
        ><select id="scenario" aria-label="Preview scenario">
          <option value="normal">Shared pool</option>
          <option value="empty">New pool</option>
          <option value="low">Low balance</option>
          <option value="negative">Negative balance</option>
          <option value="offline">Disconnected</option>
          <option value="failure">Service failure</option></select
        ><button id="watch">Watch: 1 coffee</button
        ><button id="narrow">320px</button>
      </div>
    </header>
    <main class="stage">
      <coffee-tracker-card></coffee-tracker-card>
      <p class="caption">
        A little ritual. A shared balance.<br />All data is synthetic. No real
        accounts or payments.
      </p>
    </main>
    <script type="module">
      import "../custom_components/coffee_tracker/www/coffee-tracker-card.js";
      import { createMockPool, mockConfig } from "./fixtures.mjs";
      // Preview only: Home Assistant supplies ha-icon in the installed card.
      // These Material Design Icons paths keep the standalone demo faithful.
      // Material Design Icons 7.4.47, @mdi/svg (Apache 2.0).

        "mdi:chevron-down":
          "M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z",
        "mdi:chevron-up":

        "mdi:coffee-outline":
          "M2,21V19H20V21H2M20,8V5H18V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z",

        "mdi:history":
          "M13.5,8H12V13L16.28,15.54L17,14.33L13.5,12.25V8M13,3A9,9 0 0,0 4,12H1L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3",
        "mdi:chevron-right":
          "M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z",
        "mdi:undo":
          "M12.5,8C9.85,8 7.45,9 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.15,8 12.5,8Z",
      };
      customElements.define(
        "ha-icon",
        class extends HTMLElement {
          static observedAttributes = ["icon"];
          set icon(value) {
            this.setAttribute("icon", value);
          }
          get icon() {
            return this.getAttribute("icon");
          }
          connectedCallback() {
            this.render();
          }
          attributeChangedCallback() {
            this.render();
          }
          render() {
            if (!this.shadowRoot) this.attachShadow({ mode: "open" });
            this.shadowRoot.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:block;width:100%;height:100%;fill:currentColor"><path d="${mdiPaths[this.getAttribute("icon")] || ""}"></path></svg>`;
          }
        },
      );
      const card = document.querySelector("coffee-tracker-card");
      card.setConfig(mockConfig);
      let pool, off;
      function setup(value = "normal") {
        off?.();
        pool = createMockPool({
          empty: value === "empty",
          balance: value === "low" ? 75 : value === "negative" ? -225 : 2450,
          failOnce: value === "failure",
        });
        const publish = (h) => {
          card.hass = value === "offline" ? { ...h, connected: false } : h;
        };
        publish(pool.hass());
        off = pool.subscribe(publish);
        window.demoPool = pool;
      }
      setup();
      document.querySelector("#scenario").onchange = (e) =>
        setup(e.target.value);
      document.querySelector("#theme").onclick = (e) => {
        document.body.classList.toggle("dark");
        e.target.textContent = document.body.classList.contains("dark")
          ? "Light theme"
          : "Dark theme";
      };
      document.querySelector("#watch").onclick = () => pool.externalCoffee();
      document.querySelector("#narrow").onclick = (e) => {
        const s = document.querySelector(".stage");
        const narrow = s.style.maxWidth === "320px";
        s.style.maxWidth = narrow ? "430px" : "320px";
        e.target.textContent = narrow ? "320px" : "430px";
      };
    </script>
  </body>
</html>
