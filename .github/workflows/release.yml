name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: npm ci
      - run: npm run check
      - run: pip install -r requirements-test.txt
      - run: pytest -q
      - run: python scripts/check_package.py
      - run: git diff --exit-code -- custom_components/coffee_tracker/www/coffee-tracker-card.js
      - name: Package integration
        working-directory: custom_components
        run: zip -r ../coffee-tracker.zip coffee_tracker -x '*/__pycache__/*' '*.pyc'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" coffee-tracker.zip custom_components/coffee_tracker/www/coffee-tracker-card.js --generate-notes --verify-tag
